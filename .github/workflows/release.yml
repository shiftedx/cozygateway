name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:installer
      - name: verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./packages/gateway/package.json').version")"
          test "$version" = "$(sed -n 's/^version: //p' integrations/attach-plugin/plugin.yaml)"
      - run: pnpm bundle
      - name: smoke the bundle
        run: |
          cat > /tmp/smoke.json <<'EOF'
          { "name": "smoke", "port": 18787, "host": "127.0.0.1",
            "dbPath": "/tmp/smoke.db",
            "hermes": {
              "url": "ws://127.0.0.1:19999/api/ws",
              "tokenEnv": "SMOKE_HERMES_TOKEN",
              "profiles": { "default": { "tokenEnv": "SMOKE_ATTACH_TOKEN" } }
            } }
          EOF
          SMOKE_HERMES_TOKEN=smoke SMOKE_ATTACH_TOKEN=smoke node dist-bundle/cozygateway.mjs serve --config /tmp/smoke.json &
          ok=
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:18787/health | grep -q '"contract":"v1"' && ok=1 && break
            sleep 1
          done
          kill %1
          [ "${ok:-}" = 1 ]
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-bundle/cozygateway.mjs
            dist-bundle/cozygateway.mjs.sha256
            dist-bundle/cozygateway-hermes-attach-plugin.tar.gz
            dist-bundle/cozygateway-hermes-attach-plugin.tar.gz.sha256
            dist-bundle/cozygateway-installer.sh
            dist-bundle/cozygateway-installer.sh.sha256
            dist-bundle/install.ps1
            dist-bundle/install.ps1.sha256
          generate_release_notes: true
