name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:installer
      - name: verify release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./packages/gateway/package.json').version")"
          test "$version" = "$(sed -n 's/^version: //p' integrations/attach-plugin/plugin.yaml)"
      - run: pnpm bundle
      - name: attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dist-bundle/*
      - name: smoke the bundle
        run: |
          cat > /tmp/smoke.json <<'EOF'
          { "name": "smoke", "port": 18787, "host": "127.0.0.1",
            "dbPath": "/tmp/smoke.db",
            "hermesEndpoints": [{
              "id": "default",
              "url": "ws://127.0.0.1:19999/api/ws",
              "tokenEnv": "SMOKE_HERMES_TOKEN",
              "profiles": { "default": { "tokenEnv": "SMOKE_ATTACH_TOKEN" } }
            }] }
          EOF
          SMOKE_HERMES_TOKEN=smoke SMOKE_ATTACH_TOKEN=smoke node dist-bundle/cozygateway.mjs serve --config /tmp/smoke.json &
          ok=
          attempt=1
          while [ "$attempt" -le 15 ]; do
            curl -fsS http://127.0.0.1:18787/health | grep -q '"contract":"v1"' && ok=1 && break
            sleep 1
            attempt=$((attempt + 1))
          done
          kill %1
          [ "${ok:-}" = 1 ]
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist-bundle/cozygateway.mjs
            dist-bundle/cozygateway.mjs.sha256
            dist-bundle/cozygateway-hermes-attach-plugin.tar.gz
            dist-bundle/cozygateway-hermes-attach-plugin.tar.gz.sha256
            dist-bundle/cozygateway-installer.sh
            dist-bundle/cozygateway-installer.sh.sha256
            dist-bundle/gateway-supervisor.cjs
            dist-bundle/gateway-supervisor.cjs.sha256
            dist-bundle/install.ps1
            dist-bundle/install.ps1.sha256
            dist-bundle/install.sh
            dist-bundle/install.sh.sha256
          generate_release_notes: true
