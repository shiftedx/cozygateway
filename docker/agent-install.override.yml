# Compose override for the agent-driven install (docs/agent-install.md, scripts/agent-install.sh).
#
# It layers the three things a bots-only gateway needs on top of docker-compose.yml, without
# editing the reference deployment:
#
#   1. the generated bots config (local/cozygateway.config.json) mounted in place of the baked one;
#   2. COZYGATEWAY_HERMES_PASSWORD, the dashboard password the bridge logs in with. The config file
#      names the VARIABLE; the value lives only in .env and in the process environment;
#   3. host.docker.internal, so the container can dial `hermes dashboard` running on the host. On
#      Docker Desktop it already resolves; the extra_hosts entry is what makes it work on Linux.
#
# Usage, from the repo root:
#   docker compose -f docker-compose.yml -f docker/agent-install.override.yml up -d --build gateway
#
# Naming the `gateway` service explicitly leaves the push relay out: bots need no push relay.
#
# WARNING, learned the hard way: every value in .env is interpolated by compose before it reaches
# the container. A literal `$` must be written `$$` in .env, or the value arrives truncated at the
# first `$` and the bridge answers with a 401 that looks like a wrong password.
services:
  gateway:
    environment:
      COZYGATEWAY_HERMES_PASSWORD: "${COZYGATEWAY_HERMES_PASSWORD:?set the dashboard password in .env (escape any $ as $$)}"
    volumes:
      - ./local/cozygateway.config.json:/app/cozygateway.config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
